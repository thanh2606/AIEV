services:
  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-aiev}'
      MYSQL_USER: '${DB_USERNAME:-aiev}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - './.runtime/mysql-data:/var/lib/mysql'
    networks:
      - aiev
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD}'
      retries: 3
      timeout: 5s

  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - './.runtime/redis-data:/data'
    networks:
      - aiev
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s

  laravel-api:
    build:
      context: .
      dockerfile: apps/laravel-api/Dockerfile.dev
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - '${FORWARD_API_PORT:-8000}:8000'
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_WORKER_URL: http://node-worker:6870
    volumes:
      - ./:/app
    networks:
      - aiev
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  laravel-horizon:
    build:
      context: .
      dockerfile: apps/laravel-api/Dockerfile.dev
    command: php artisan horizon
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_WORKER_URL: http://node-worker:6870
    volumes:
      - ./:/app
    networks:
      - aiev
    depends_on:
      - laravel-api

  laravel-reverb:
    build:
      context: .
      dockerfile: apps/laravel-api/Dockerfile.dev
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - '${FORWARD_REVERB_PORT:-8080}:8080'
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_WORKER_URL: http://node-worker:6870
    volumes:
      - ./:/app
    networks:
      - aiev
    depends_on:
      - laravel-api

  node-worker:
    build:
      context: .
      dockerfile: apps/node-worker/Dockerfile.dev
    command: npm run dev -w apps/node-worker
    ports:
      - '${FORWARD_NODE_WORKER_PORT:-6870}:6870'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
      # Mount thư mục .claude của host vào để chia sẻ Auth Token của Claude CLI
      - ~/.claude:/root/.claude
    networks:
      - aiev

networks:
  aiev:
    driver: bridge
